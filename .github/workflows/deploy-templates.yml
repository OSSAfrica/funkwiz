name: Publish deployment templates

on:
  workflow_run:
    workflows: [Checks]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-templates
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'OSSAfrica/funkwiz' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.id == github.event.repository.id)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the checked main commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TRIGGER: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$SOURCE_SHA&status=success&per_page=1" --jq '.workflow_runs | length')
            if [ "$passed" = "0" ]; then
              echo "Checks must pass on this main commit before templates can be published."
              exit 1
            fi
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.source.outputs.current == 'true'
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        if: steps.source.outputs.current == 'true'
      - name: Publish Personal and School snapshots from checked main
        if: steps.source.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch origin main:refs/remotes/origin/main
          if [ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]; then
            echo "A newer main commit exists; its completed checks will publish the next templates."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for mode in personal school; do
            branch="deploy-$mode"
            template_dir="$RUNNER_TEMP/funkwiz-$mode"
            existing=$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' ls-remote --heads origin "refs/heads/$branch" | cut -f1)
            parent="$SOURCE_SHA"
            if [ -n "$existing" ]; then
              git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch origin "$branch"
              parent="$existing"
            fi
            git worktree add --detach "$template_dir" "$parent"
            git -C "$template_dir" read-tree --reset -u "$SOURCE_SHA"
            bun scripts/configure-deploy-template.ts --root "$template_dir" --mode "$mode" --source "$SOURCE_SHA"
            bunx oxfmt --write "$template_dir/wrangler.jsonc" "$template_dir/package.json" "$template_dir/deployment-template.json"
            git -C "$template_dir" add -A
            if ! git -C "$template_dir" diff --cached --quiet; then
              git -C "$template_dir" -c commit.gpgsign=false commit -s -m "chore(template): publish $mode from $SOURCE_SHA"
              git -C "$template_dir" -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$branch"
            fi
            git worktree remove "$template_dir"
          done
